services:
  postgres:
    image: postgres:17-alpine
    container_name: lead-intelligence-postgres
    environment:
      POSTGRES_DB: lead_intelligence
      POSTGRES_USER: lead_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-password}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - lead-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lead_app -d lead_intelligence"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  lead-data:

